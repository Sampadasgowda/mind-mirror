<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · Mindmirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Create your free account</h1>
      <p class="muted">Unlock full results for every test and keep them in one place.</p>
      <div id="msg"></div>
      <form id="form" novalidate>
        <label>Name
          <input type="text" name="name" autocomplete="name" maxlength="60" required>
        </label>
        <label>Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
          <small class="muted">At least 8 characters.</small>
        </label>
        <label class="check">
          <input type="checkbox" name="terms" required>
          <span>I agree to the <a href="terms.html" target="_blank">Terms</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>.</span>
        </label>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
      <p class="switch">Already have an account? <a id="to-login" href="login.html">Sign in</a></p>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>
